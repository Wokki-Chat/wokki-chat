services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_DATABASE: wokki_chat
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/my.cnf:/etc/mysql/conf.d/my.cnf

  web:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./webpage:/var/www/html
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: dev
      DB_NAME: wokki_chat

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: dev
    ports:
      - "8081:80"
    depends_on:
      - db

  ignis:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python workers.py Ignis 5001
    env_file: ./backend/.env
    ports:
      - "5001:5001"
    depends_on:
      - db
      - redis

  aqua:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python workers.py Aqua 5002
    env_file: ./backend/.env
    ports:
      - "5002:5002"
    depends_on:
      - db
      - redis

  terra:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python workers.py Terra 5003
    env_file: ./backend/.env
    ports:
      - "5003:5003"
    depends_on:
      - db
      - redis

  ventus:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python workers.py Ventus 5004
    env_file: ./backend/.env
    ports:
      - "5004:5004"
    depends_on:
      - db
      - redis

  proxy:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python proxy.py
    env_file: ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - ignis
      - aqua
      - terra
      - ventus
      - db
      - redis
      
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  db_data:
  redis_data: