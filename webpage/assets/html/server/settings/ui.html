<div class="settings-content">
    <div class="settings-tabs">
        <div class="settings-group">
            <p class="settings-group-title">Server Settings</p>
            <a class="settings-tab no-underline" id="general-info-tab" data-page="general_info">
                <span class="material-symbols-rounded">info</span>
                <p>General Info</p>
            </a>
            <a class="settings-tab no-underline" id="role-tab" data-page="roles">
                <span class="material-symbols-rounded">user_attributes</span>
                <p>Roles</p>
            </a>
        </div>
    </div>
    <div class="setting-page">
        <a class="close-settings-container no-underline">
            <div class="close-settings">
                <span class="material-symbols-rounded">close</span>
            </div>
            <p>Esc</p>
        </a>
        <div id="settings-page-content">
            {{settings_content}}
        </div>
    </div>
</div>
