<div class="connections-container">
    <div class="all-connections-container">
        <div class="connection-container" id="chat-action" data-action="{{onclick_event.chat}}">
            <div class="connection-name">Chat</div>
            <img src="../assets/icons/connections/chat.svg" alt="Chat Icon" class="connection-icon">
            <div class="connection-status">{{connection_status.chat}}</div>
        </div>
        <div class="connection-container" id="spotify-action" data-action="{{onclick_event.spotify}}">
            <div class="connection-name">Spotify</div>
            <img src="../assets/icons/connections/spotify.svg" alt="Spotify Icon" class="connection-icon">
            <div class="connection-status">{{connection_status.spotify}}</div>
        </div>
        <div class="connection-container" id="github-action" data-action="{{onclick_event.github}}">
            <div class="connection-name">GitHub</div>
            <img src="../assets/icons/connections/github.svg" alt="GitHub Icon" class="connection-icon">
            <div class="connection-status">{{connection_status.github}}</div>
        </div>
    </div>
</div>
