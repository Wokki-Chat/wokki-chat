<div class="logs-container">
    <div class="logs-options-container">
        <div class="log-option">
            <input type="checkbox" id="worker-checkbox" class="log-option-checkbox">
            <label for="worker-checkbox">Hide Worker Name</label>
        </div>
        <div class="log-option">
            <input type="checkbox" id="timestamp-checkbox" class="log-option-checkbox">
            <label for="timestamp-checkbox">Hide timestamp</label>
        </div>
        <div class="log-option">
            <input type="checkbox" id="file-checkbox" class="log-option-checkbox">
            <label for="file-checkbox">Hide file name</label>
        </div>
        <div class="log-option">
            <input type="checkbox" id="type-checkbox" class="log-option-checkbox">
            <label for="type-checkbox">Hide type</label>
        </div>
        <div class="log-option">
            <input type="checkbox" id="message-checkbox" class="log-option-checkbox">
            <label for="message-checkbox">Hide message</label>
        </div>
        <div class="log-option">
            <input type="checkbox" id="color-checkbox" checked class="log-option-checkbox">
            <label for="color-checkbox">Colorize</label>
        </div>
    </div>
    <div>
        <p class="connected-server">You are connected to <span id="connected-server"></span></p>
    </div>
    <div id="logs" class="logs-textarea"></div>
</div>
