<h2 class="settings-page-title">Appearance</h2>
<div class="settings-appearance-container"> 
    <div class="theme-container">
        <h3>Theme</h3>
        <div class="appearance-type-container">
            <p class="appearance-type-title">Default themes</p>
            <p class="appearance-type-description">Personalize your experience by changing your theme</p>
            <div class="theme-options-container">
                <div class="theme-option light {{light_active}}" onclick="setTheme('light')"></div>
                <div class="theme-option dark {{dark_active}}" onclick="setTheme('dark')"></div>
                <div class="theme-option night {{night_active}}" onclick="setTheme('night')"></div>
            </div>
        </div>
        <div class="appearance-type-container {{hidden_container_1}}">
            <p class="appearance-type-title">Chat themes</p>
            <p class="appearance-type-description">{{connect_chat_account_text}}</p>
            <div class="theme-options-container">
                <div class="theme-option {{hidden_1}} {{hidden_1_active}}" onclick="setTheme('{{hidden_1}}')"></div>
                <div class="theme-option {{hidden_2}} {{hidden_2_active}}" onclick="setTheme('{{hidden_2}}')"></div>
            </div>
        </div>
        <h3>Layout</h3>
        <div class="appearance-type-container">
            <p class="appearance-type-title">Layouts</p>
            <p class="appearance-type-description">Change your layout to fit your needs</p>
            <div class="theme-options-container">
                <div class="theme-option floaty {{floaty_active}}" onclick="setLayout('floaty')"></div>
                <div class="theme-option compact {{compact_active}}" onclick="setLayout('compact')"></div>
            </div>
        </div>
    </div>
    <script>
    const themes = ["light", "dark", "night", "chat_dark_blue", "chat_light_blue"];

    function setTheme(theme) {
        if (theme === "hidden_1_disabled" || theme === "hidden_2_disabled") return;
        document.cookie = `theme=${theme}; expires=Fri, 31 Dec 9999 23:59:59 GMT; path=/; SameSite=None; Secure;`;
        themes.forEach(t => document.documentElement.classList.remove(t));
        document.documentElement.classList.add(theme);
        document.querySelectorAll(".theme-option").forEach(el => el.classList.remove("active"));
        const activeBtn = document.querySelector(`.theme-option.${theme}`);
        if (activeBtn) activeBtn.classList.add("active");
    }
    </script>
</div>
