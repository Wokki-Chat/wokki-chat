<h2 class="settings-page-title">Appearance</h2>
<div class="settings-appearance-container"> 
    <div class="theme-container">
        <p>Theme</p>
        <div class="theme-options-container">
            <div class="theme-option light {{light_active}}" onclick="setTheme('light')"></div>
            <div class="theme-option dark {{dark_active}}" onclick="setTheme('dark')"></div>
            <div class="theme-option night {{night_active}}" onclick="setTheme('night')"></div>
        </div>
    </div>
</div>
